name: office_management
description: Office Manager admin panel (Flutter Android port of the React admin-web project).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  url_launcher: ^6.2.6
  fl_chart: ^0.68.0
  go_router: ^14.2.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
